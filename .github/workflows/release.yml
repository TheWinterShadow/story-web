name: Release

# Push a tag that exactly matches manifest.json's version (e.g. `0.1.0`, no `v`)
# and this builds the plugin and publishes a GitHub release with the three
# files Obsidian installs from. Use `npm version patch|minor|major` + `git push --follow-tags`.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  # For signed build-provenance attestations of the release assets.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Tag must match manifest.json version
        run: |
          manifest_version=$(node -p "require('./manifest.json').version")
          if [ "$manifest_version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest.json version $manifest_version"; exit 1
          fi

      - name: Bundle must not require Node/Electron modules (mobile compatibility)
        run: |
          bad=$(grep -oE 'require\("[^"]+"\)' main.js | sort -u | grep -v 'require("obsidian")' || true)
          if [ -n "$bad" ]; then echo "Non-mobile-safe requires in bundle:"; echo "$bad"; exit 1; fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --title "$GITHUB_REF_NAME" --generate-notes
